<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to Verble.fun</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f8f9fe;color:#181445;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f8f9fe;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:520px;background-color:#ffffff;border:1px solid #e3e0f3;border-radius:20px;">
            <tr>
              <td style="padding:36px 36px 32px;">
                <img src="{{ .SiteURL }}/verble-email-wordmark.png" alt="Verble.fun" width="143" height="32" style="display:block;width:143px;height:32px;margin:0 0 32px;border:0;">
                <h1 style="margin:0 0 14px;font-size:25px;font-weight:800;line-height:1.2;color:#181445;">Your sign-in link</h1>
                <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#464555;">Tap the button below to sign in and keep your stats, streaks, and progress together.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="border-radius:12px;background-color:#4030da;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 24px;color:#ffffff;font-size:16px;font-weight:700;line-height:1.2;text-decoration:none;">Sign in to Verble.fun</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#66637a;">This link expires in one hour and can only be used once. If you did not request it, you can ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#79768b;">A little phrase play, every day.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
